<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 500" width="100%" height="100%" style="background-color: #f8fafc; font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', 'BIZ UDPGothic', sans-serif;">
  <defs>
    <!-- マーカー矢印（青） -->
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#2563eb" />
    </marker>
    <filter id="shadow-ta" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="1" dy="2" stdDeviation="2" flood-opacity="0.15" />
    </filter>
  </defs>

  <!-- タイトルバー -->
  <rect x="0" y="0" width="780" height="42" fill="#1e3a8a" />
  <text x="20" y="26" font-size="15" font-weight="bold" fill="#ffffff">【津和野】Day 2 晴天コース（プランA）散策ガイドマップ</text>
  <text x="760" y="26" font-size="11" fill="#93c5fd" text-anchor="end">位置正確反映版（青破線：巡回ルート）</text>

  <!-- 地形・山・川・線路 -->
  <!-- 城山・西側の山並み -->
  <path d="M 0 42 L 180 42 Q 210 180 190 280 Q 170 380 180 500 L 0 500 Z" fill="#ecfdf5" stroke="#a7f3d0" stroke-width="1.5" />
  <text x="70" y="160" font-size="14" font-weight="bold" fill="#047857" letter-spacing="3">城 山</text>
  <text x="70" y="180" font-size="10" fill="#059669">(標高362m)</text>

  <!-- 津和野城跡（山頂石垣シンボル） -->
  <path d="M 50 110 L 90 110 L 80 135 L 40 135 Z" fill="#cbd5e1" stroke="#64748b" stroke-width="1.5" />
  <text x="65" y="100" font-size="10" font-weight="bold" fill="#475569" text-anchor="middle">津和野城跡(山頂)</text>

  <!-- 津和野川（南北の流れ） -->
  <path d="M 540 42 Q 520 150 490 250 Q 450 350 430 500" fill="none" stroke="#bae6fd" stroke-width="16" stroke-linecap="round" />
  <text x="470" y="320" font-size="11" fill="#0284c7" transform="rotate(75, 470, 320)">津 和 野 川 ➔</text>

  <!-- JR山口線（線路） -->
  <path d="M 640 42 L 640 150 Q 640 250 630 350 L 610 500" fill="none" stroke="#64748b" stroke-width="4" />
  <path d="M 640 42 L 640 150 Q 640 250 630 350 L 610 500" fill="none" stroke="#ffffff" stroke-width="2" stroke-dasharray="8,8" />
  <text x="655" y="100" font-size="9" fill="#64748b">JR山口線 (SL走行路)</text>

  <!-- 殿町通り・伝統建造物エリア -->
  <rect x="300" y="260" width="150" height="110" rx="6" fill="#fef9c3" fill-opacity="0.5" stroke="#fef08a" stroke-width="1.2" />
  <text x="310" y="280" font-size="10" font-weight="bold" fill="#854d0e">殿町通り（武家屋敷・鯉）</text>

  <!-- 本町通り・商家エリア -->
  <rect x="310" y="140" width="150" height="100" rx="6" fill="#ffedd5" fill-opacity="0.5" stroke="#fed7aa" stroke-width="1.2" />
  <text x="320" y="160" font-size="10" font-weight="bold" fill="#9a3412">本町通り（老舗商家街）</text>

  <!-- 方位マーク -->
  <g transform="translate(730, 80)">
    <circle cx="0" cy="0" r="16" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5" filter="url(#shadow-ta)" />
    <path d="M 0 -13 L 4 0 L 0 -2 L -4 0 Z" fill="#dc2626" />
    <path d="M 0 13 L 4 0 L 0 2 L -4 0 Z" fill="#64748b" />
    <text x="0" y="-15" font-size="9" font-weight="bold" fill="#dc2626" text-anchor="middle">N</text>
  </g>

  <!-- ==================== 訪問経路（青破線ルート） ==================== -->
  <!-- ①駅(470, 75) ➔ ②殿町通り(375, 310) -->
  <path d="M 460 85 Q 430 160 380 295" fill="none" stroke="#2563eb" stroke-width="2.8" stroke-dasharray="6,4" marker-end="url(#arrow-blue)" />
  <!-- ②殿町通り(375, 310) ➔ ③沙羅の木(380, 390) -->
  <path d="M 375 325 L 380 375" fill="none" stroke="#2563eb" stroke-width="2.8" stroke-dasharray="6,4" marker-end="url(#arrow-blue)" />
  <!-- ③沙羅の木(380, 390) ➔ ④太皷谷稲成(200, 340) （鳥居石段263段登破） -->
  <path d="M 360 395 Q 280 380 215 345" fill="none" stroke="#2563eb" stroke-width="2.8" stroke-dasharray="6,4" marker-end="url(#arrow-blue)" />
  <!-- ④太皷谷稲成(200, 340) ➔ ⑤リフト乗り場(120, 240) （徒歩5分） -->
  <path d="M 180 330 Q 140 290 125 255" fill="none" stroke="#2563eb" stroke-width="2.8" stroke-dasharray="6,4" marker-end="url(#arrow-blue)" />
  <!-- ⑤リフト乗り場(120, 240) ➔ ⑥本町通り(380, 190) （平坦道・老舗散策） -->
  <path d="M 135 230 Q 240 210 365 195" fill="none" stroke="#2563eb" stroke-width="2.8" stroke-dasharray="6,4" marker-end="url(#arrow-blue)" />
  <!-- ⑥本町通り(380, 190) ➔ ⑦駅(515, 75) （荷物回収・SL乗車） -->
  <path d="M 390 180 Q 440 140 485 85" fill="none" stroke="#2563eb" stroke-width="2.8" stroke-dasharray="6,4" marker-end="url(#arrow-blue)" />

  <!-- ==================== 訪問スポット ノード・ピン ==================== -->

  <!-- ① JR津和野駅 (470, 75) -->
  <g transform="translate(470, 75)" filter="url(#shadow-ta)">
    <rect x="-95" y="-14" width="190" height="28" rx="14" fill="#ffffff" stroke="#1e3a8a" stroke-width="2" />
    <circle cx="-80" cy="0" r="10" fill="#1e3a8a" />
    <text x="-80" y="4" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle">1</text>
    <text x="10" y="4" font-size="10" font-weight="bold" fill="#1e293b" text-anchor="middle">JR津和野駅 到着 (10:45)</text>
  </g>

  <!-- ② 殿町通り（錦鯉・養老館・教会） (375, 310) -->
  <g transform="translate(375, 310)" filter="url(#shadow-ta)">
    <rect x="-85" y="-14" width="170" height="28" rx="14" fill="#ffffff" stroke="#16a34a" stroke-width="2" />
    <circle cx="-70" cy="0" r="10" fill="#16a34a" />
    <text x="-70" y="4" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle">2</text>
    <text x="10" y="4" font-size="10" font-weight="bold" fill="#1e293b" text-anchor="middle">殿町通り散策 (11:00)</text>
  </g>

  <!-- ③ 沙羅の木 松韻亭（うずめ飯） (380, 390) -->
  <g transform="translate(380, 390)" filter="url(#shadow-ta)">
    <rect x="-85" y="-14" width="170" height="28" rx="14" fill="#ffffff" stroke="#d97706" stroke-width="2" />
    <circle cx="-70" cy="0" r="10" fill="#d97706" />
    <text x="-70" y="4" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle">3</text>
    <text x="10" y="4" font-size="10" font-weight="bold" fill="#1e293b" text-anchor="middle">沙羅の木 うずめ飯 (12:15昼食)</text>
  </g>

  <!-- ④ 太皷谷稲成神社 (200, 340) -->
  <g transform="translate(200, 340)" filter="url(#shadow-ta)">
    <rect x="-85" y="-14" width="170" height="28" rx="14" fill="#ffffff" stroke="#dc2626" stroke-width="2" />
    <circle cx="-70" cy="0" r="10" fill="#dc2626" />
    <text x="-70" y="4" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle">4</text>
    <text x="10" y="4" font-size="10" font-weight="bold" fill="#1e293b" text-anchor="middle">太皷谷稲成神社 (13:30)</text>
  </g>

  <!-- 徒歩5分注記 -->
  <rect x="110" y="285" width="80" height="16" rx="3" fill="#ffffff" stroke="#94a3b8" stroke-width="0.8" />
  <text x="150" y="297" font-size="8.5" font-weight="bold" fill="#475569" text-anchor="middle">徒歩5分移動</text>

  <!-- ⑤ 観光リフト乗り場（津和野城跡スタンプ） (120, 240) -->
  <g transform="translate(120, 240)" filter="url(#shadow-ta)">
    <rect x="-95" y="-14" width="190" height="28" rx="14" fill="#ffffff" stroke="#9333ea" stroke-width="2" />
    <circle cx="-80" cy="0" r="10" fill="#9333ea" />
    <text x="-80" y="4" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle">5</text>
    <text x="10" y="4" font-size="9.5" font-weight="bold" fill="#1e293b" text-anchor="middle">リフト乗場:城スタンプ (14:15)</text>
  </g>

  <!-- ⑥ 本町通り（源氏巻・ざら茶） (380, 190) -->
  <g transform="translate(380, 190)" filter="url(#shadow-ta)">
    <rect x="-95" y="-14" width="190" height="28" rx="14" fill="#ffffff" stroke="#ea580c" stroke-width="2" />
    <circle cx="-80" cy="0" r="10" fill="#ea580c" />
    <text x="-80" y="4" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle">6</text>
    <text x="10" y="4" font-size="10" font-weight="bold" fill="#1e293b" text-anchor="middle">本町通り老舗散策 (14:45)</text>
  </g>

  <!-- ⑦ JR津和野駅（SL乗車） (530, 75) -->
  <g transform="translate(530, 75)" filter="url(#shadow-ta)">
    <rect x="-55" y="-14" width="110" height="28" rx="14" fill="#ffffff" stroke="#1e3a8a" stroke-width="2" />
    <circle cx="-40" cy="0" r="10" fill="#1e3a8a" />
    <text x="-40" y="4" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle">7</text>
    <text x="12" y="4" font-size="10" font-weight="bold" fill="#1e293b" text-anchor="middle">SL乗車 (16:12)</text>
  </g>

  <!-- 凡例ボックス（右下） -->
  <g transform="translate(480, 410)" filter="url(#shadow-ta)">
    <rect x="0" y="0" width="280" height="75" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2" />
    <text x="10" y="16" font-size="9.5" font-weight="bold" fill="#1e3a8a">【凡例 ＆ Day 2 晴天ルート】</text>
    <line x1="12" y1="28" x2="45" y2="28" stroke="#2563eb" stroke-width="2.5" stroke-dasharray="5,3" />
    <text x="52" y="31" font-size="8.5" fill="#334155">青破線: プランA 巡回経路（①➔②➔③➔④➔⑤➔⑥➔⑦）</text>
    <circle cx="20" cy="45" r="5" fill="#9333ea" />
    <text x="32" y="48" font-size="8.5" fill="#334155">⑤リフト山麓駅で「日本100名城スタンプ」押印</text>
    <text x="32" y="62" font-size="8" fill="#64748b">※リフト不乗・登山なし ➔ ⑥本町通りをゆったり散策</text>
  </g>
</svg>
