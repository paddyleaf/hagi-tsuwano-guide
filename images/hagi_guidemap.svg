<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 500" width="100%" height="100%" style="background-color: #f8fafc; font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', 'BIZ UDPGothic', sans-serif;">
  <defs>
    <!-- マーカー矢印 -->
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#dc2626" />
    </marker>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="1" dy="2" stdDeviation="2" flood-opacity="0.15" />
    </filter>
  </defs>

  <!-- タイトルバー -->
  <rect x="0" y="0" width="780" height="42" fill="#1e3a8a" />
  <text x="20" y="26" font-size="16" font-weight="bold" fill="#ffffff">【付録２】萩 散策ガイドマップ（Day 1 訪問場所 ＆ 破線巡回ルート）</text>
  <text x="740" y="26" font-size="11" fill="#93c5fd" text-anchor="end">縮尺・位置概念図</text>

  <!-- 地形・海・山・川 -->
  <!-- 日本海 -->
  <path d="M 0 42 L 780 42 L 780 130 Q 550 140 400 135 Q 260 130 180 150 Q 120 165 0 180 Z" fill="#e0f2fe" stroke="#bae6fd" stroke-width="1.5" />
  <text x="350" y="85" font-size="15" font-weight="bold" fill="#0284c7" letter-spacing="4">日 本 海</text>

  <!-- 指月山（北西） -->
  <path d="M 50 130 Q 110 90 160 130 Q 180 170 140 210 Q 80 220 50 180 Z" fill="#dcfce7" stroke="#86efac" stroke-width="2" />
  <text x="105" y="155" font-size="12" font-weight="bold" fill="#166534" text-anchor="middle">指月山</text>
  <text x="105" y="172" font-size="9" fill="#15803d" text-anchor="middle">(標高143m)</text>

  <!-- 菊ヶ浜（海岸砂浜） -->
  <path d="M 160 140 Q 230 130 330 140 Q 400 145 460 140" fill="none" stroke="#fde68a" stroke-width="8" stroke-linecap="round" />
  <text x="250" y="130" font-size="11" font-weight="bold" fill="#b45309">菊ヶ浜（白砂青松）</text>

  <!-- 阿武川・橋本川・松本川（三角州形成） -->
  <!-- 橋本川（西〜南） -->
  <path d="M 170 480 Q 200 360 220 300 Q 200 240 180 200 Q 170 160 155 145" fill="none" stroke="#bae6fd" stroke-width="14" stroke-linecap="round" />
  <!-- 松本川（東） -->
  <path d="M 520 480 Q 540 370 560 280 Q 580 210 540 160 Q 510 140 460 140" fill="none" stroke="#bae6fd" stroke-width="14" stroke-linecap="round" />
  <text x="580" y="250" font-size="10" fill="#0284c7" transform="rotate(75, 580, 250)">松 本 川 ➔</text>
  <text x="180" y="340" font-size="10" fill="#0284c7" transform="rotate(-75, 180, 340)">橋 本 川 ➔</text>

  <!-- 城下町エリア（薄いベージュ背景） -->
  <rect x="220" y="200" width="230" height="150" rx="8" fill="#fef9c3" fill-opacity="0.5" stroke="#fef08a" stroke-width="1.5" />
  <text x="235" y="222" font-size="11" font-weight="bold" fill="#854d0e">【国指定史跡・世界遺産】萩城下町</text>

  <!-- 方位マーク -->
  <g transform="translate(730, 80)">
    <circle cx="0" cy="0" r="16" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5" filter="url(#shadow)" />
    <path d="M 0 -13 L 4 0 L 0 -2 L -4 0 Z" fill="#dc2626" />
    <path d="M 0 13 L 4 0 L 0 2 L -4 0 Z" fill="#64748b" />
    <text x="0" y="-15" font-size="9" font-weight="bold" fill="#dc2626" text-anchor="middle">N</text>
  </g>

  <!-- ==================== 訪問経路（破線ルート） ==================== -->
  <!-- ①(340, 420) ➔ ②(500, 180) -->
  <path d="M 350 410 Q 420 380 460 300 Q 480 240 495 195" fill="none" stroke="#dc2626" stroke-width="2.8" stroke-dasharray="6,4" marker-end="url(#arrow)" />
  <!-- ②(500, 180) ➔ ③(310, 260) -->
  <path d="M 485 185 Q 400 210 325 255" fill="none" stroke="#dc2626" stroke-width="2.8" stroke-dasharray="6,4" marker-end="url(#arrow)" />
  <!-- ③(310, 260) ➔ ④(145, 205) -->
  <path d="M 295 260 Q 220 250 160 215" fill="none" stroke="#dc2626" stroke-width="2.8" stroke-dasharray="6,4" marker-end="url(#arrow)" />
  <!-- ④(145, 205) ➔ ⑤(660, 290) -->
  <path d="M 155 200 Q 230 170 340 180 Q 480 200 580 240 Q 620 260 645 280" fill="none" stroke="#dc2626" stroke-width="2.8" stroke-dasharray="6,4" marker-end="url(#arrow)" />
  <!-- ⑤(660, 290) ➔ ⑥(270, 150) -->
  <path d="M 645 295 Q 520 260 410 200 Q 340 160 285 155" fill="none" stroke="#dc2626" stroke-width="2.8" stroke-dasharray="6,4" marker-end="url(#arrow)" />
  <!-- ⑥(270, 150) ➔ ⑦(340, 310) -->
  <path d="M 275 165 Q 290 220 330 295" fill="none" stroke="#dc2626" stroke-width="2.8" stroke-dasharray="6,4" marker-end="url(#arrow)" />

  <!-- ==================== 訪問スポット ノード・ピン ==================== -->

  <!-- ① 萩バスセンター ＆ ホテル長谷川 (340, 420) -->
  <g transform="translate(340, 420)" filter="url(#shadow)">
    <rect x="-100" y="-14" width="200" height="28" rx="14" fill="#ffffff" stroke="#1e3a8a" stroke-width="2" />
    <circle cx="-85" cy="0" r="10" fill="#1e3a8a" />
    <text x="-85" y="4" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle">1</text>
    <text x="5" y="4" font-size="10" font-weight="bold" fill="#1e293b" text-anchor="middle">萩BC ＆ ホテル長谷川 (11:40)</text>
  </g>

  <!-- ② みなと食堂 ととと (500, 180) -->
  <g transform="translate(500, 180)" filter="url(#shadow)">
    <rect x="-85" y="-14" width="170" height="28" rx="14" fill="#ffffff" stroke="#d97706" stroke-width="2" />
    <circle cx="-70" cy="0" r="10" fill="#d97706" />
    <text x="-70" y="4" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle">2</text>
    <text x="10" y="4" font-size="10" font-weight="bold" fill="#1e293b" text-anchor="middle">みなと食堂 ととと (12:15昼食)</text>
  </g>

  <!-- ③ 萩城下町（高杉晋作誕生地・菊屋家） (305, 260) -->
  <g transform="translate(305, 260)" filter="url(#shadow)">
    <rect x="-95" y="-14" width="190" height="28" rx="14" fill="#ffffff" stroke="#16a34a" stroke-width="2" />
    <circle cx="-80" cy="0" r="10" fill="#16a34a" />
    <text x="-80" y="4" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle">3</text>
    <text x="10" y="4" font-size="10" font-weight="bold" fill="#1e293b" text-anchor="middle">城下町・高杉誕生地 (13:30)</text>
  </g>

  <!-- ④ 萩城天守閣跡・指月公園 (140, 210) -->
  <g transform="translate(140, 210)" filter="url(#shadow)">
    <rect x="-80" y="-14" width="160" height="28" rx="14" fill="#ffffff" stroke="#9333ea" stroke-width="2" />
    <circle cx="-65" cy="0" r="10" fill="#9333ea" />
    <text x="-65" y="4" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle">4</text>
    <text x="10" y="4" font-size="10" font-weight="bold" fill="#1e293b" text-anchor="middle">萩城天守閣跡 (14:40)</text>
  </g>

  <!-- ⑤ 松陰神社・松下村塾 (660, 290) -->
  <g transform="translate(660, 290)" filter="url(#shadow)">
    <rect x="-85" y="-14" width="170" height="28" rx="14" fill="#ffffff" stroke="#2563eb" stroke-width="2" />
    <circle cx="-70" cy="0" r="10" fill="#2563eb" />
    <text x="-70" y="4" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle">5</text>
    <text x="10" y="4" font-size="10" font-weight="bold" fill="#1e293b" text-anchor="middle">松陰神社・松下村塾 (15:45)</text>
  </g>

  <!-- ⑥ 菊ヶ浜（夕景） (270, 150) -->
  <g transform="translate(270, 150)" filter="url(#shadow)">
    <rect x="-70" y="-14" width="140" height="28" rx="14" fill="#ffffff" stroke="#ea580c" stroke-width="2" />
    <circle cx="-55" cy="0" r="10" fill="#ea580c" />
    <text x="-55" y="4" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle">6</text>
    <text x="10" y="4" font-size="10" font-weight="bold" fill="#1e293b" text-anchor="middle">菊ヶ浜 夕景 (16:45)</text>
  </g>

  <!-- ⑦ 居魚屋 おもしろき (340, 310) -->
  <g transform="translate(340, 310)" filter="url(#shadow)">
    <rect x="-80" y="-14" width="160" height="28" rx="14" fill="#ffffff" stroke="#dc2626" stroke-width="2" />
    <circle cx="-65" cy="0" r="10" fill="#dc2626" />
    <text x="-65" y="4" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle">7</text>
    <text x="10" y="4" font-size="10" font-weight="bold" fill="#1e293b" text-anchor="middle">割烹 おもしろき (18:00夕食)</text>
  </g>

  <!-- 移動補足注記（高杉誕生地 ➔ 萩城跡） -->
  <path d="M 220 260 Q 185 245 165 228" fill="none" stroke="#64748b" stroke-width="1" stroke-dasharray="2,2" />
  <rect x="175" y="235" width="85" height="16" rx="3" fill="#ffffff" stroke="#94a3b8" stroke-width="0.8" />
  <text x="217" y="247" font-size="8.5" font-weight="bold" fill="#475569" text-anchor="middle">約20分(バス/徒歩)</text>

  <!-- 凡例ボックス（右下） -->
  <g transform="translate(20, 435)" filter="url(#shadow)">
    <rect x="0" y="0" width="260" height="55" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2" />
    <text x="10" y="16" font-size="9.5" font-weight="bold" fill="#1e293b">【凡例 ＆ 巡回メモ】</text>
    <line x1="12" y1="28" x2="45" y2="28" stroke="#dc2626" stroke-width="2.5" stroke-dasharray="5,3" />
    <text x="52" y="31" font-size="8.5" fill="#334155">破線: Day 1 巡回経路（一筆書き）</text>
    <circle cx="20" cy="42" r="5" fill="#9333ea" />
    <text x="32" y="45" font-size="8.5" fill="#334155">城跡と菊ヶ浜は隣接・夕景へスムーズ移動</text>
  </g>
</svg>
